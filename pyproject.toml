[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-reconciliation-automation"
version = "1.0.0"
description = "Auditable reconciliation between DDA spreadsheets and ERP PDF exports."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Isac Bandeira" }]
license = { file = "LICENSE" }
dependencies = [
  "openpyxl>=3.1,<4",
  "pdfplumber>=0.11,<1",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
financial-reconciliation = "financial_reconciliation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
